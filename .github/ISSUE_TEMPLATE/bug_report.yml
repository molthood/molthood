name: Bug report
description: Something behaves differently from how it is documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what the product did in response.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The URL, or the command you ran.
      placeholder: https://molthood.org/askmoltagent
  - type: textarea
    id: evidence
    attributes:
      label: Anything that shows it
      description: >
        A screenshot, a response body, an execution id. If a check reported
        something that turned out to be wrong, the source link it cited is the
        most useful thing you can include.
