name: Feature request
description: Something Molthood should be able to do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        Please check the [roadmap](https://docs.molthood.org/roadmap) first —
        it lists what is planned and why, and says plainly what is only an
        intention.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where it currently stops.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would solve it
      description: Optional. The problem is more useful than the solution.
